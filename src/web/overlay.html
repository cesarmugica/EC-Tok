<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EC-Tok overlay</title>
<style>
  :root { --c1: #FE2C55; --c2: #25F4EE; --fs: 34px; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #fff; }
  .shadow { text-shadow: 0 2px 4px rgba(0,0,0,.85), 0 0 14px rgba(0,0,0,.55); }

  /* ---------- alertas ---------- */
  #alerts { position: fixed; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; padding: 24px; }
  #alerts.top { top: 0; } #alerts.center { top: 50%; transform: translateY(-50%); } #alerts.bottom { bottom: 0; }
  .alert { display: flex; align-items: center; gap: 18px; max-width: min(92vw, 900px); padding: 18px 26px 18px 18px;
    border-radius: 26px; background: linear-gradient(135deg, rgba(20,20,28,.88), rgba(40,20,40,.88));
    border: 3px solid var(--c1); box-shadow: 0 0 0 3px rgba(37,244,238,.35), 0 18px 40px rgba(0,0,0,.45); }
  .alert .pic { width: calc(var(--fs) * 2.6); height: calc(var(--fs) * 2.6); flex: none; border-radius: 22px; display: grid;
    place-items: center; font-size: calc(var(--fs) * 1.7); background: rgba(255,255,255,.08); overflow: hidden; }
  .alert .pic img { width: 100%; height: 100%; object-fit: contain; }
  .alert .txt { font-size: var(--fs); font-weight: 800; line-height: 1.15; }
  .alert .txt .u { color: var(--c2); }
  .alert .txt .g { color: var(--c1); }
  .alert .sub { font-size: calc(var(--fs) * .55); font-weight: 600; opacity: .85; margin-top: 6px; }
  .in-pop { animation: pop .55s cubic-bezier(.2,1.6,.4,1) both; }
  .in-slide { animation: slide .5s cubic-bezier(.2,.9,.3,1.2) both; }
  .in-bounce { animation: bounce .9s both; }
  .in-fade { animation: fade .5s ease both; }
  .out { animation: out .45s ease both; }
  @keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes slide { from { transform: translateX(-120%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes bounce { 0% { transform: translateY(-140%); opacity: 0; } 55% { transform: translateY(8%); opacity: 1; }
    75% { transform: translateY(-4%); } 100% { transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes out { to { transform: scale(.9); opacity: 0; } }
  .big .pic { animation: wiggle 1.2s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg) scale(1.06); } 75% { transform: rotate(8deg) scale(1.06); } }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; border-radius: 3px; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  /* ---------- animaciones ---------- */
  #anim { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #anim .a { position: absolute; left: 50%; transform: translateX(-50%); object-fit: contain; animation: fade .35s ease both; }
  #anim .a.top { top: 2vh; } #anim .a.center { top: 50%; transform: translate(-50%, -50%); } #anim .a.bottom { bottom: 2vh; }
  #anim .a.out { animation: fadeout .4s ease both; }
  /* animación con el nombre de quien la mandó */
  #anim .w { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column;
    align-items: center; animation: fade .35s ease both; }
  #anim .w.out { animation: fadeout .4s ease both; }
  #anim .w .a { position: static; transform: none; animation: none; }
  #anim .who { margin-top: -3vh; display: flex; align-items: center; gap: 1.2vh; padding: .9vh 2.6vh .9vh .9vh; border-radius: 99px;
    background: linear-gradient(90deg, var(--c1), #8c28ff); box-shadow: 0 .6vh 2.4vh rgba(0,0,0,.45), 0 0 0 .35vh rgba(255,255,255,.85);
    color: #fff; max-width: 92vw; animation: whoPop .55s cubic-bezier(.2,1.6,.4,1) .15s both; }
  #anim .who img, #anim .who .av { width: 6.4vh; height: 6.4vh; border-radius: 50%; object-fit: cover; flex: none; background: rgba(255,255,255,.25);
    display: grid; place-items: center; font-size: 3.6vh; box-shadow: 0 0 0 .3vh #fff; }
  #anim .who .t { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
  #anim .who b { font-size: max(3.6vh, 20px); font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 .2vh .6vh rgba(0,0,0,.4); }
  #anim .who small { font-size: max(2.2vh, 13px); font-weight: 700; opacity: .92; white-space: nowrap; }
  /* ---------- escenas: personaje con letrero ---------- */
  #anim .sc { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); }
  #anim .sc .body { position: relative; width: 100%; height: 100%; transform-origin: 50% 100%;
    animation: scIn .75s cubic-bezier(.25,1.55,.45,1) both, scIdle 1.6s ease-in-out .8s infinite; }
  #anim .sc.out .body { animation: scOut .5s cubic-bezier(.5,0,.8,.4) both; }
  #anim .sc .char { position: absolute; inset: 0; width: 100%; height: 100%; }
  #anim .sc .part { position: absolute; }
  #anim .sc .part.heart { animation: heartIn .5s cubic-bezier(.3,1.8,.5,1) .45s both, heartBeat 1s ease-in-out 1s infinite; }
  #anim .sc .sign { position: absolute; box-sizing: border-box; }
  #anim .sc .sign .in { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2% 5%;
    box-sizing: border-box; color: #3b2314; font-weight: 900; line-height: 1.08; overflow: hidden; word-break: normal; overflow-wrap: normal;
    animation: signIn .45s cubic-bezier(.3,1.7,.5,1) .55s both; }
  #anim .sc.sprite .body { animation: scIn .75s cubic-bezier(.25,1.55,.45,1) both; }
  #anim .sc .frames { position: absolute; inset: 0; background-repeat: no-repeat; }
  #anim .sc .sign .u { color: var(--c1); white-space: nowrap; }
  @keyframes scIn { from { transform: translateY(105%) scale(.9); } to { transform: none; } }
  @keyframes scIdle { 0%, 100% { transform: rotate(0) scale(1, 1); } 20% { transform: rotate(-2.2deg) scale(1.02, .98); }
    40% { transform: translateY(-3.5%) rotate(0) scale(.99, 1.02); } 60% { transform: rotate(2.2deg) scale(1.02, .98); } 80% { transform: translateY(-1.5%) rotate(0); } }
  @keyframes scOut { to { transform: translateY(110%) rotate(-4deg); } }
  @keyframes heartIn { from { transform: scale(0) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes heartBeat { 0%, 100% { transform: translateY(0) scale(1); } 15% { transform: translateY(-4%) scale(1.18); } 30% { transform: translateY(-6%) scale(.96); } 45% { transform: translateY(-8%) scale(1.12); } 70% { transform: translateY(-3%) scale(1); } }
  @keyframes signIn { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes whoPop { from { opacity: 0; transform: translateY(2vh) scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes fadeout { to { opacity: 0; } }
  [hidden] { display: none !important; }
  /* ---------- animaciones especiales (las del streamer) ---------- */
  #special { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  #special .sp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 100vw; max-height: 100vh;
    object-fit: contain; animation: fade .35s ease both; }
  #special .sp.out { animation: fadeout .45s ease both; }
  /* ---------- ya regresamos ---------- */
  #brb { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh;
    z-index: 4; animation: fade .6s ease both; }
  #brb.dim { background: radial-gradient(circle at 50% 45%, rgba(20,20,30,.55), rgba(10,10,16,.9)); }
  #brb .pic { height: 46vh; max-width: 80vw; object-fit: contain; }
  #brb h1 { margin: 0; font-size: max(5vh, 30px); font-weight: 900; text-align: center; }
  #brb p { margin: 0; font-size: max(2.8vh, 18px); font-weight: 700; color: var(--c2); text-align: center; }

  /* ---------- metas ---------- */
  #goal { margin: 12px; display: flex; flex-direction: column; gap: 14px; }
  /* la barra de la meta tiene un largo razonable (no todo lo ancho de la fuente); si la fuente es más angosta, se ajusta */
  .goal { width: min(100%, calc(var(--fs) * 14)); box-sizing: border-box; padding: 12px 16px; border-radius: 18px; background: rgba(15,15,22,.72); border: 2px solid rgba(255,255,255,.12); }
  .goal .head { display: flex; justify-content: space-between; gap: 10px; font-weight: 800; font-size: calc(var(--fs) * .62); }
  .goal .head span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .goal .head span:last-child { white-space: nowrap; flex: none; }
  .goal .bar { margin-top: 8px; height: calc(var(--fs) * .62); border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden; }
  .goal .fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--c2), var(--c1)); transition: width .6s ease; }
  .goal.done .fill { background: linear-gradient(90deg, #ffd600, #ff8a00); }
  .goal.done .head span:last-child::after { content: "  🎉"; }

  /* ---------- top donadores ---------- */
  #top, #likers { margin: 12px; }
  /* el cuadro abraza su contenido (no se estira a todo lo ancho): así la cantidad queda junto al nombre y no se
     pierde si la fuente se recorta en LIVE Studio */
  .topbox { width: max-content; min-width: 11em; max-width: 100%; box-sizing: border-box; padding: 12px 14px; border-radius: 18px; background: rgba(15,15,22,.72); border: 2px solid rgba(255,255,255,.12); }
  .topbox h1 { margin: 0 0 8px; font-size: calc(var(--fs) * .66); color: var(--c2); }
  .topbox ol { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--fs) * .32); }
  .topbox ol li:nth-child(-n+3) { padding-top: calc(var(--fs) * .3); }
  .topbox li { display: grid; grid-template-columns: 1.6em calc(var(--fs) * 1.1) minmax(0, 1fr); gap: 10px; align-items: center;
    font-size: calc(var(--fs) * .56); font-weight: 700; }
  .topbox li .n { color: var(--c1); text-align: center; }
  .topbox li img, .topbox li .av { width: calc(var(--fs) * 1.1); height: calc(var(--fs) * 1.1); border-radius: 50%; object-fit: cover;
    background: rgba(255,255,255,.15); display: grid; place-items: center; font-size: .8em; }
  /* nombre arriba y la cantidad abajo (no al lado): así el cuadro es angosto y nada se sale de la fuente */
  .topbox li .who { display: flex; flex-direction: column; min-width: 0; line-height: 1.15; margin-left: .3em; }
  .topbox li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 12em; }
  .topbox li .amt { font-size: .82em; color: var(--c2); white-space: nowrap; }
  .topbox li .pic { position: relative; width: calc(var(--fs) * 1.1); height: calc(var(--fs) * 1.1); }
  .topbox li .pic svg { position: absolute; filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
  .topbox li .pic .crown { width: 80%; left: 10%; top: -48%; }
  .topbox li .pic .medal { width: 62%; right: -22%; bottom: -22%; }
  .topbox .empty { opacity: .6; font-size: calc(var(--fs) * .5); }

  /* ---------- metas de acción (lista fija: imagen + texto) ---------- */
  #actions { margin: 12px; display: inline-flex; flex-direction: column; gap: calc(var(--au) * .18 * var(--agap, 1)); --au: calc(var(--fs) * var(--asz, 1)); }
  #actions h1 { margin: 0 0 calc(var(--au) * .1); font-size: calc(var(--au) * .62); color: var(--c2); }
  #actions .side { display: flex; align-items: center; gap: calc(var(--au) * .22); padding: calc(var(--au) * .1) calc(var(--au) * .42) calc(var(--au) * .1) calc(var(--au) * .1);
    border-radius: 999px; background: rgba(15,15,22,.55); border: 1px solid rgba(255,255,255,.14); width: fit-content; max-width: 92vw; }
  #actions .side img, #actions .side .ph { width: calc(var(--au) * 1.25); height: calc(var(--au) * 1.25); object-fit: contain; flex: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.5)); }
  #actions .side .tx { font-size: calc(var(--au) * .58); font-weight: 800; white-space: pre-line; line-height: 1.15; }
  #actions.stack { gap: calc(var(--au) * .12 * var(--agap, 1)); align-items: center; }
  #actions .st { display: flex; flex-direction: column; align-items: center; }
  #actions .st img, #actions .st .ph { width: calc(var(--au) * 2.3); height: calc(var(--au) * 2.3); object-fit: contain; filter: drop-shadow(0 3px 5px rgba(0,0,0,.55)); }
  #actions .st .tx { margin-top: calc(var(--au) * -.28); padding: calc(var(--au) * .05) calc(var(--au) * .38); border-radius: calc(var(--au) * .4); background: rgba(20,20,20,.82);
    border: calc(var(--au) * .07) solid #E9B949; font-size: calc(var(--au) * .5); font-weight: 800; white-space: pre-line; text-align: center; line-height: 1.15; max-width: 60vw; position: relative; }
  /* cuadrícula: N columnas de regalos, imagen arriba y su etiqueta abajo (recomendado hasta 6×6) */
  #actions.grid .gr { display: grid; grid-template-columns: repeat(var(--cols, 4), auto); gap: calc(var(--au) * .18 * var(--agap, 1)) calc(var(--au) * .22 * var(--agap, 1)); justify-content: center; }
  #actions.grid .st img, #actions.grid .st .ph { width: calc(var(--au) * 1.7); height: calc(var(--au) * 1.7); }
  #actions.grid .st .tx { font-size: calc(var(--au) * .36); max-width: calc(var(--au) * 4.2); margin-top: calc(var(--au) * -.2); }
  #actions.grid .st .ph { font-size: calc(var(--au) * 1.1); }
  #actions .ph { display: grid; place-items: center; font-size: calc(var(--au) * .8); }
  #actions .st .ph { font-size: calc(var(--au) * 1.5); } #actions .side .ph { font-size: calc(var(--au) * .95); }
  /* imagen dentro de un círculo oscuro semitransparente (opcional) */
  #actions.circle .side img, #actions.circle .side .ph { padding: calc(var(--au) * .14); border-radius: 50%; background: rgba(0,0,0,.5); box-sizing: border-box; width: calc(var(--au) * 1.45); height: calc(var(--au) * 1.45); }
  #actions.circle .st img, #actions.circle .st .ph { padding: calc(var(--au) * .26); border-radius: 50%; background: rgba(0,0,0,.5); box-sizing: border-box; }

  /* ---------- 💃 live de baile ---------- */
  .dz { --dz: 1; --dring: 0 .15em .35em rgba(0,0,0,.8); font-family: var(--dfont, var(--tfont, inherit)); }
  .dz .nm, .dz .pt, .dz h1, .dz .clk { color: var(--dcol, var(--tc, #fff)); }
  .dz.ring .nm, .dz.ring .pt, .dz.ring h1, .dz.ring .clk { text-shadow: var(--tsh, var(--dring)); }
  /* los nombres en cursiva y con sombra no se cortan: espacio para la inclinación y la sombra (sin mover nada) */
  .dz .nm { padding: .3em .45em .35em .3em; margin: -.3em -.45em -.35em -.3em; box-sizing: content-box; }
  .dz .av { border-radius: 50%; object-fit: cover; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; overflow: hidden; }
  .dz .gi { object-fit: contain; flex: none; }
  .dz .gi.circle { border-radius: 50%; background: rgba(0,0,0,.6); box-sizing: border-box; padding: calc(.55vw * var(--dz)); }
  /* cuadrícula de activación: barra (como los lives de baile) */
  #dgrid { position: fixed; left: 0; right: 0; top: 0; padding: calc(1.2vw * var(--dz)) 2.5vw; }
  #dgrid .wrap { border-radius: calc(2vw * var(--dz)); padding: calc(1vw * var(--dz)) calc(1.4vw * var(--dz)); }
  #dgrid .tops, #dgrid .gifts { display: flex; }
  #dgrid .tops > div, #dgrid .gifts > div { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; gap: .6vw; }
  #dgrid .tops > div { flex-direction: column; gap: .2vw; }
  #dgrid .tops .av { width: calc(5.4vw * var(--dz)); height: calc(5.4vw * var(--dz)); border: calc(.4vw * var(--dz)) solid var(--avb, var(--c)); box-shadow: var(--avg, none); }
  #dgrid .tops .nm { font-weight: 900; font-size: calc(2.2vw * var(--dz)); max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; font-style: italic; }
  #dgrid .segs { display: flex; height: calc(4.6vw * var(--dz)); margin: calc(.7vw * var(--dz)) 0; border-radius: var(--rad, 999px); overflow: hidden;
    box-shadow: var(--frame, 0 0 0 calc(.35vw * var(--dz)) rgba(255,255,255,.85), 0 .6vw 1.6vw rgba(0,0,0,.45)); }
  #dgrid .segs > div { min-width: 7%; display: flex; align-items: center; padding: 0 1.2vw; box-sizing: border-box; transition: flex-grow .6s ease;
    background: var(--fill, linear-gradient(180deg, color-mix(in srgb, var(--c) 70%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 75%, #000))); }
  #dgrid .segs > div + div { border-left: calc(.3vw * var(--dz)) solid var(--sep, rgba(255,255,255,.9)); }
  #dgrid .segs .pt { font-weight: 900; font-style: italic; font-size: calc(2.8vw * var(--dz)); }
  #dgrid .gifts .gi { width: calc(5vw * var(--dz)); height: calc(5vw * var(--dz)); }
  /* cuadrícula de activación: tarjetas (en fila, 2 o 3 renglones, en columna) */
  #dgrid .cards { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: calc(1.2vw * var(--dz)); }
  #dgrid .card { display: flex; align-items: center; gap: calc(1vw * var(--dz)); padding: calc(.8vw * var(--dz)) calc(1.2vw * var(--dz)); border-radius: calc(1.6vw * var(--dz));
    background: var(--card, linear-gradient(90deg, color-mix(in srgb, var(--c) 85%, transparent), color-mix(in srgb, var(--c) 30%, transparent))); box-shadow: var(--cardb, 0 0 0 calc(.25vw * var(--dz)) rgba(255,255,255,.75));
    border-radius: var(--crd, calc(1.6vw * var(--dz))); }
  #dgrid .card .av { width: calc(6vw * var(--dz)); height: calc(6vw * var(--dz)); border: calc(.35vw * var(--dz)) solid var(--avb, #fff); box-shadow: var(--avg, none); }
  #dgrid .card .tx { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1.05; }
  #dgrid .card .nm { font-weight: 900; font-size: calc(2.4vw * var(--dz)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; font-style: italic; }
  #dgrid .card .pt { font-weight: 900; font-size: calc(3vw * var(--dz)); }
  #dgrid .card .gi { width: calc(5.4vw * var(--dz)); height: calc(5.4vw * var(--dz)); }
  /* cuadrícula de activación: placas inclinadas */
  #dgrid .plates { display: flex; gap: calc(1.4vw * var(--dz)); padding: calc(2.6vw * var(--dz)) calc(1vw * var(--dz)) calc(1vw * var(--dz)); }
  #dgrid .pl { position: relative; flex: 1 1 0; min-width: 0; transform: skewX(-12deg); border-radius: calc(.8vw * var(--dz));
    border: calc(.35vw * var(--dz)) solid rgba(255,255,255,.95); box-shadow: 0 .6vw 1.4vw rgba(0,0,0,.45);
    background: repeating-linear-gradient(-45deg, rgba(255,255,255,.14) 0 .5vw, transparent .5vw 1.3vw),
      linear-gradient(180deg, color-mix(in srgb, var(--c) 75%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000)); }
  #dgrid .tagpt { font-weight: 900; font-style: italic; }
  #dgrid .pl > .in { transform: skewX(12deg); display: flex; align-items: center; gap: calc(.8vw * var(--dz)); padding: calc(.6vw * var(--dz)) calc(1.2vw * var(--dz)); }
  #dgrid .pl .av { width: calc(5.8vw * var(--dz)); height: calc(5.8vw * var(--dz)); border: calc(.35vw * var(--dz)) solid #fff; margin-left: calc(-1.8vw * var(--dz)); }
  #dgrid .pl .tx { display: flex; flex-direction: column; min-width: 0; flex: 1; line-height: 1; }
  #dgrid .pl .nm { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: calc(1.6vw * var(--dz)); letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #dgrid .pl .pt { font-weight: 900; font-style: italic; font-size: calc(3vw * var(--dz)); white-space: nowrap; }
  #dgrid .pl .gi { position: absolute; top: calc(-1.9vw * var(--dz)); right: calc(.4vw * var(--dz)); width: calc(3.4vw * var(--dz)); height: calc(3.4vw * var(--dz)); }
  #dgrid .pl .win { position: absolute; right: calc(-.6vw * var(--dz)); bottom: calc(-1.3vw * var(--dz)); transform: skewX(12deg); background: #111; color: #ffd54a;
    font-weight: 900; font-style: italic; font-size: calc(1.2vw * var(--dz)); padding: calc(.15vw * var(--dz)) calc(.7vw * var(--dz)); border-radius: calc(.4vw * var(--dz)); border: 1px solid #ffd54a; }
  /* corona: la que va ganando */
  .dz .crwrap { position: relative; display: inline-grid; flex: none; }
  .dz .crown { position: absolute; left: 50%; top: 0; transform: translate(-50%, -78%) rotate(-12deg); font-size: calc(3vw * var(--dz)); filter: drop-shadow(0 .2vw .3vw rgba(0,0,0,.6)); animation: dcrown 2.4s ease-in-out infinite; }
  @keyframes dcrown { 50% { transform: translate(-50%, -88%) rotate(-6deg); } }
  /* reloj pegado abajo de la cuadrícula / barra */
  .dz .dclkbox { display: flex; justify-content: center; margin-top: calc(.6vw * var(--dz)); }
  .dz .dclkbox .clk { font-weight: 900; font-style: italic; font-variant-numeric: tabular-nums; font-size: calc(3.6vw * var(--dz)); padding: calc(.1vw * var(--dz)) calc(1.6vw * var(--dz));

<body>
<div id="alerts" class="top"></div>
<div id="brb" hidden></div>
<div id="special"></div>
<div id="anim"></div>

<script>
  const params = new URLSearchParams(location.search);
  const which = (params.get('w') || 'alerts').split(',');
  const isPreviewFrame = params.has('preview');
  let OV_VERSION = '';
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  let cfg = null, stats = null, likeMark = 0, LOC = 'es-MX';
  const EMPTY_TOP = {es: 'Todavía nadie… ¡manda el primer regalo!', en: 'Nobody yet… send the first gift!', pt: 'Ninguém ainda… mande o primeiro presente!'};
  const EMPTY_LIKES = {es: 'Todavía nadie… ¡dale tap a la pantalla!', en: 'Nobody yet… tap the screen!', pt: 'Ninguém ainda… toque na tela!'};
  const EMOJI = {gift: '🎁', follow: '💖', share: '📣', like: '❤️', custom: '💬'};

  function applyStyle() {
    const s = cfg.style, r = document.documentElement.style;
    let fs = +params.get('size') || s.font_size;
    if (params.has('preview')) fs = Math.min(fs, innerWidth * 0.075);  // la vista previa de EC-Tok es angosta: que la alerta quepa
    r.setProperty('--c1', s.color); r.setProperty('--c2', s.accent); r.setProperty('--fs', fs + 'px');
    $('#alerts').className = s.position;
  }
  function fill(tpl, ev) {
    const g = ev.gift || {};
    const vals = {user: `<span class="u">${esc(ev.user ? ev.user.name : '')}</span>`, gift: `<span class="g">${esc(g.name || '')}</span>`,
      count: esc(g.count || ''), diamonds: esc(g.total || ''), likes: esc((ev.likes_total || 0).toLocaleString(LOC))};
    return esc(tpl).replace(/\{(user|gift|count|diamonds|likes)\}/g, (_, k) => vals[k]);
  }

  // ---------- alertas (una a la vez) ----------
  const queue = [];
  let showing = false;
  function wantAlert(ev) {
    const a = cfg.alerts;
    const show = c => c.on && c.banner !== false;  // «📢 Alerta» desmarcada = solo la animación
    if (ev.type === 'gift') return show(a.gift) && ev.gift.total >= a.gift.min_diamonds ? a.gift : null;
    if (ev.type === 'follow') return show(a.follow) ? a.follow : null;
    if (ev.type === 'share') return show(a.share) ? a.share : null;
    if (ev.type === 'custom') return {on: true, text: ev.text || '', seconds: ev.seconds || 4};  // botón personalizado sin personaje
    return null;
  }
  function likeMilestone(total, sim) {
    const a = cfg.alerts.like; if (!a.on || !a.every || a.banner === false) return;
    const mark = Math.floor(total / a.every) * a.every;
    if (mark > likeMark && mark > 0) { queue.push({ev: {type: 'like', likes_total: mark, sim}, conf: a}); likeMark = mark; next(); }
  }
  function next() {
    if (showing || !queue.length) return;
    showing = true;
    const {ev, conf} = queue.shift(), box = document.createElement('div');

  // ---------- animaciones (una a la vez, en fila) ----------

  function freeMedia(root) {

        const [x, y, pw, ph] = part.box; Object.assign(p.style, {left: x + '%', top: y + '%', width: pw + '%', height: ph + '%'});
        body.appendChild(p);
      }
      const sign = document.createElement('div'); sign.className = 'sign';

        if (box.length > 4) Object.assign(sign.style, {left: box[0] - box[2] / 2 + '%', top: box[1] - box[3] / 2 + '%', width: box[2] + '%', height: box[3] + '%', transform: `rotate(${box[4]}deg)`});

      };

    } else if (a.who && a.who.name) {

      el = document.createElement('div'); el.className = 'w'; el.appendChild(media);
      const who = document.createElement('div'); who.className = 'who';
      who.innerHTML = `${a.who.avatar ? `<img src="${esc(a.who.avatar)}" alt="" referrerpolicy="no-referrer">` : '<span class="av">💜</span>'}<span class="t"><b>${esc(a.who.name)}</b>${a.caption ? `<small>${esc(a.caption)}</small>` : ''}</span>`;

    applyStyle();
    showBrb(data.brb);
    $('#goal').hidden = !which.includes('goal'); $('#top').hidden = !which.includes('top'); $('#likers').hidden = !which.includes('likes'); $('#alerts').hidden = !which.includes('alerts');
    $('#actions').hidden = !which.includes('actions');
    drawGoals(); drawTop(); drawActions(); setDance(data.dance);
  }
  // UNA sola conexión de eventos para todas las fuentes de EC-Tok abiertas en el mismo programa (LIVE Studio/OBS),
  // con un «trabajador compartido» (overlay-worker.js). El navegador solo abre 6 conexiones a la vez con la misma
  // dirección: con 6 o más fuentes, cada una con su conexión abierta, ya no quedaba lugar para bajar los videos y
  // los personajes dejaban de salir. Si el navegador no tiene trabajadores compartidos, cada fuente se conecta sola.
  function handle(ev) { if (ev.type === '_open') { load().catch(() => {}); return; } onEvent(ev); }
  function ownStream() {
    const es = new EventSource('/api/stream?who=overlay');
    es.onmessage = m => { try { handle(JSON.parse(m.data)); } catch (_) {} };
    es.onopen = () => handle({type: '_open'});
  }
  load().then(() => {
    let shared = false;
    if (typeof SharedWorker === 'function') {
      try {
        const w = new SharedWorker('/overlay-worker.js?v=' + encodeURIComponent(OV_VERSION || ''), {name: 'ectok-eventos'});
        w.port.onmessage = m => { try { handle(JSON.parse(m.data)); } catch (_) {} };
        w.port.start();
        addEventListener('pagehide', () => { try { w.port.postMessage('bye'); } catch (_) {} });
        w.onerror = () => { if (!shared) return; shared = false; ownStream(); };  // si el trabajador falla, conectarse sola
        shared = true;
      } catch (_) { shared = false; }
    }
    if (!shared) ownStream();
    // la fuente propia de «Ya regresamos» avisa que está abierta (las vistas previas de EC-Tok no cuentan)
    if (which.includes('brb') && !isPreviewFrame) {
      const here = () => fetch('/api/overlay?here=brb').catch(() => {});
      here(); setInterval(here, 4000);
    }
  }).catch(() => setTimeout(() => location.reload(), 3000));
</script>
