<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EC-Tok overlay</title>
<style>
  :root { --c1: #FE2C55; --c2: #25F4EE; --fs: 34px; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; height: 100%;
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif; color: #fff; }
  .shadow { text-shadow: 0 2px 4px rgba(0,0,0,.85), 0 0 14px rgba(0,0,0,.55); }

  /* ---------- alertas ---------- */
  #alerts { position: fixed; left: 0; right: 0; display: flex; justify-content: center; pointer-events: none; padding: 24px; }
  #alerts.top { top: 0; } #alerts.center { top: 50%; transform: translateY(-50%); } #alerts.bottom { bottom: 0; }
  .alert { display: flex; align-items: center; gap: 18px; max-width: min(92vw, 900px); padding: 18px 26px 18px 18px;
    border-radius: 26px; background: linear-gradient(135deg, rgba(20,20,28,.88), rgba(40,20,40,.88));
    border: 3px solid var(--c1); box-shadow: 0 0 0 3px rgba(37,244,238,.35), 0 18px 40px rgba(0,0,0,.45); }
  .alert .pic { width: calc(var(--fs) * 2.6); height: calc(var(--fs) * 2.6); flex: none; border-radius: 22px; display: grid;
    place-items: center; font-size: calc(var(--fs) * 1.7); background: rgba(255,255,255,.08); overflow: hidden; }
  .alert .pic img { width: 100%; height: 100%; object-fit: contain; }
  .alert .txt { font-size: var(--fs); font-weight: 800; line-height: 1.15; }
  .alert .txt .u { color: var(--c2); }
  .alert .txt .g { color: var(--c1); }
  .alert .sub { font-size: calc(var(--fs) * .55); font-weight: 600; opacity: .85; margin-top: 6px; }
  .in-pop { animation: pop .55s cubic-bezier(.2,1.6,.4,1) both; }
  .in-slide { animation: slide .5s cubic-bezier(.2,.9,.3,1.2) both; }
  .in-bounce { animation: bounce .9s both; }
  .in-fade { animation: fade .5s ease both; }
  .out { animation: out .45s ease both; }
  @keyframes pop { from { transform: scale(.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes slide { from { transform: translateX(-120%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes bounce { 0% { transform: translateY(-140%); opacity: 0; } 55% { transform: translateY(8%); opacity: 1; }
    75% { transform: translateY(-4%); } 100% { transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes out { to { transform: scale(.9); opacity: 0; } }
  .big .pic { animation: wiggle 1.2s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-8deg) scale(1.06); } 75% { transform: rotate(8deg) scale(1.06); } }
  .confetti { position: fixed; top: -20px; width: 12px; height: 18px; border-radius: 3px; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  /* ---------- animaciones ---------- */
  #anim { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #anim .a { position: absolute; left: 50%; transform: translateX(-50%); object-fit: contain; animation: fade .35s ease both; }
  #anim .a.top { top: 2vh; } #anim .a.center { top: 50%; transform: translate(-50%, -50%); } #anim .a.bottom { bottom: 2vh; }
  #anim .a.out { animation: fadeout .4s ease both; }
  /* animación con el nombre de quien la mandó */
  #anim .w { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; flex-direction: column;
    align-items: center; animation: fade .35s ease both; }
  #anim .w.out { animation: fadeout .4s ease both; }
  #anim .w .a { position: static; transform: none; animation: none; }
  #anim .who { margin-top: -3vh; display: flex; align-items: center; gap: 1.2vh; padding: .9vh 2.6vh .9vh .9vh; border-radius: 99px;
    background: linear-gradient(90deg, var(--c1), #8c28ff); box-shadow: 0 .6vh 2.4vh rgba(0,0,0,.45), 0 0 0 .35vh rgba(255,255,255,.85);
    color: #fff; max-width: 92vw; animation: whoPop .55s cubic-bezier(.2,1.6,.4,1) .15s both; }
  #anim .who img, #anim .who .av { width: 6.4vh; height: 6.4vh; border-radius: 50%; object-fit: cover; flex: none; background: rgba(255,255,255,.25);
    display: grid; place-items: center; font-size: 3.6vh; box-shadow: 0 0 0 .3vh #fff; }
  #anim .who .t { display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
  #anim .who b { font-size: max(3.6vh, 20px); font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 .2vh .6vh rgba(0,0,0,.4); }
  #anim .who small { font-size: max(2.2vh, 13px); font-weight: 700; opacity: .92; white-space: nowrap; }
  /* ---------- escenas: personaje con letrero ---------- */
  #anim .sc { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); }
  #anim .sc .body { position: relative; width: 100%; height: 100%; transform-origin: 50% 100%;
    animation: scIn .75s cubic-bezier(.25,1.55,.45,1) both, scIdle 1.6s ease-in-out .8s infinite; }
  #anim .sc.out .body { animation: scOut .5s cubic-bezier(.5,0,.8,.4) both; }
  #anim .sc .char { position: absolute; inset: 0; width: 100%; height: 100%; }
  #anim .sc .part { position: absolute; }
  #anim .sc .part.heart { animation: heartIn .5s cubic-bezier(.3,1.8,.5,1) .45s both, heartBeat 1s ease-in-out 1s infinite; }
  #anim .sc .sign { position: absolute; box-sizing: border-box; }
  #anim .sc .sign .in { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2% 5%;
    box-sizing: border-box; color: #3b2314; font-weight: 900; line-height: 1.08; overflow: hidden; word-break: normal; overflow-wrap: normal;
    animation: signIn .45s cubic-bezier(.3,1.7,.5,1) .55s both; }
  #anim .sc.sprite .body { animation: scIn .75s cubic-bezier(.25,1.55,.45,1) both; }
  #anim .sc .frames { position: absolute; inset: 0; background-repeat: no-repeat; }
  #anim .sc .sign .u { color: var(--c1); white-space: nowrap; }
  @keyframes scIn { from { transform: translateY(105%) scale(.9); } to { transform: none; } }
  @keyframes scIdle { 0%, 100% { transform: rotate(0) scale(1, 1); } 20% { transform: rotate(-2.2deg) scale(1.02, .98); }
    40% { transform: translateY(-3.5%) rotate(0) scale(.99, 1.02); } 60% { transform: rotate(2.2deg) scale(1.02, .98); } 80% { transform: translateY(-1.5%) rotate(0); } }
  @keyframes scOut { to { transform: translateY(110%) rotate(-4deg); } }
  @keyframes heartIn { from { transform: scale(0) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes heartBeat { 0%, 100% { transform: translateY(0) scale(1); } 15% { transform: translateY(-4%) scale(1.18); } 30% { transform: translateY(-6%) scale(.96); } 45% { transform: translateY(-8%) scale(1.12); } 70% { transform: translateY(-3%) scale(1); } }
  @keyframes signIn { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes whoPop { from { opacity: 0; transform: translateY(2vh) scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes fadeout { to { opacity: 0; } }
  [hidden] { display: none !important; }
  /* ---------- animaciones especiales (las del streamer) ---------- */
  #special { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  #special .sp { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); max-width: 100vw; max-height: 100vh;
    object-fit: contain; animation: fade .35s ease both; }
  #special .sp.out { animation: fadeout .45s ease both; }
  /* ---------- ya regresamos ---------- */
  #brb { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh;
    z-index: 4; animation: fade .6s ease both; }
  #brb.dim { background: radial-gradient(circle at 50% 45%, rgba(20,20,30,.55), rgba(10,10,16,.9)); }
  #brb .pic { height: 46vh; max-width: 80vw; object-fit: contain; }
  #brb h1 { margin: 0; font-size: max(5vh, 30px); font-weight: 900; text-align: center; }
  #brb p { margin: 0; font-size: max(2.8vh, 18px); font-weight: 700; color: var(--c2); text-align: center; }

  /* ---------- metas ---------- */
  #goal { margin: 12px; display: flex; flex-direction: column; gap: 14px; }
  .goal { padding: 12px 16px; border-radius: 18px; background: rgba(15,15,22,.72); border: 2px solid rgba(255,255,255,.12); }
  .goal .head { display: flex; justify-content: space-between; gap: 10px; font-weight: 800; font-size: calc(var(--fs) * .62); }
  .goal .bar { margin-top: 8px; height: calc(var(--fs) * .62); border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden; }
  .goal .fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--c2), var(--c1)); transition: width .6s ease; }
  .goal.done .fill { background: linear-gradient(90deg, #ffd600, #ff8a00); }
  .goal.done .head span:last-child::after { content: "  🎉"; }

  /* ---------- top donadores ---------- */
  #top, #likers { margin: 12px; }
  .topbox { padding: 12px 14px; border-radius: 18px; background: rgba(15,15,22,.72); border: 2px solid rgba(255,255,255,.12); }
  .topbox h1 { margin: 0 0 8px; font-size: calc(var(--fs) * .66); color: var(--c2); }
  .topbox ol { list-style: none; margin: 0; padding: 0; display: grid; gap: calc(var(--fs) * .32); }
  .topbox ol li:nth-child(-n+3) { padding-top: calc(var(--fs) * .3); }
  .topbox li { display: grid; grid-template-columns: 1.6em calc(var(--fs) * 1.1) 1fr auto; gap: 10px; align-items: center;
    font-size: calc(var(--fs) * .56); font-weight: 700; }
  .topbox li .n { color: var(--c1); text-align: center; }
  .topbox li img, .topbox li .av { width: calc(var(--fs) * 1.1); height: calc(var(--fs) * 1.1); border-radius: 50%; object-fit: cover;
    background: rgba(255,255,255,.15); display: grid; place-items: center; font-size: .8em; }
  .topbox li .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbox li .pic { position: relative; width: calc(var(--fs) * 1.1); height: calc(var(--fs) * 1.1); }
  .topbox li .pic svg { position: absolute; filter: drop-shadow(0 1px 2px rgba(0,0,0,.7)); }
  .topbox li .pic .crown { width: 80%; left: 10%; top: -48%; }
  .topbox li .pic .medal { width: 62%; right: -22%; bottom: -22%; }
  .topbox .empty { opacity: .6; font-size: calc(var(--fs) * .5); }
</style>
</head>
<body>
<div id="alerts" class="top"></div>
<div id="brb" hidden></div>
<div id="special"></div>
<div id="anim"></div>
<div id="goal" hidden></div>
<div id="top" hidden></div>
<div id="likers" hidden></div>
<script>
  const params = new URLSearchParams(location.search);
  const which = (params.get('w') || 'alerts').split(',');
  let OV_VERSION = '';
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  let cfg = null, stats = null, likeMark = 0, LOC = 'es-MX';
  const EMPTY_TOP = {es: 'Todavía nadie… ¡manda el primer regalo!', en: 'Nobody yet… send the first gift!', pt: 'Ninguém ainda… mande o primeiro presente!'};
  const EMPTY_LIKES = {es: 'Todavía nadie… ¡dale tap a la pantalla!', en: 'Nobody yet… tap the screen!', pt: 'Ninguém ainda… toque na tela!'};
  const EMOJI = {gift: '🎁', follow: '💖', share: '📣', like: '❤️'};

  function applyStyle() {
    const s = cfg.style, r = document.documentElement.style;
    r.setProperty('--c1', s.color); r.setProperty('--c2', s.accent); r.setProperty('--fs', (+params.get('size') || s.font_size) + 'px');
    $('#alerts').className = s.position;
  }
  function fill(tpl, ev) {
    const g = ev.gift || {};
    const vals = {user: `<span class="u">${esc(ev.user ? ev.user.name : '')}</span>`, gift: `<span class="g">${esc(g.name || '')}</span>`,
      count: esc(g.count || ''), diamonds: esc(g.total || ''), likes: esc((ev.likes_total || 0).toLocaleString(LOC))};
    return esc(tpl).replace(/\{(user|gift|count|diamonds|likes)\}/g, (_, k) => vals[k]);
  }

  // ---------- alertas (una a la vez) ----------
  const queue = [];
  let showing = false;
  function wantAlert(ev) {
    const a = cfg.alerts;
    const show = c => c.on && c.banner !== false;  // «📢 Alerta» desmarcada = solo la animación
    if (ev.type === 'gift') return show(a.gift) && ev.gift.total >= a.gift.min_diamonds ? a.gift : null;
    if (ev.type === 'follow') return show(a.follow) ? a.follow : null;
    if (ev.type === 'share') return show(a.share) ? a.share : null;
    return null;
  }
  function likeMilestone(total) {
    const a = cfg.alerts.like; if (!a.on || !a.every || a.banner === false) return;
    const mark = Math.floor(total / a.every) * a.every;
    if (mark > likeMark && mark > 0) { queue.push({ev: {type: 'like', likes_total: mark}, conf: a}); likeMark = mark; next(); }
  }
  function next() {
    if (showing || !queue.length) return;
    showing = true;
    const {ev, conf} = queue.shift(), box = document.createElement('div');
    const big = ev.type === 'gift' && ev.gift.total >= 100;
    const img = ev.type === 'gift' && ev.gift.image ? `<img src="${esc(ev.gift.image)}" alt="">` : ev.user && ev.user.avatar && ev.type !== 'gift' ? `<img src="${esc(ev.user.avatar)}" alt="">` : EMOJI[ev.type];
    const sub = ev.type === 'gift' ? `💎 ${ev.gift.total.toLocaleString(LOC)}` : '';
    box.className = `alert in-${cfg.style.animation}${big ? ' big' : ''}`;
    box.innerHTML = `<div class="pic">${img}</div><div><div class="txt shadow">${fill(conf.text, ev)}</div>${sub ? `<div class="sub shadow">${sub}</div>` : ''}</div>`;
    $('#alerts').replaceChildren(box);
    if (big) confetti(ev.gift.total >= 1000 ? 120 : 50);
    setTimeout(() => { box.className = 'alert out'; setTimeout(() => { box.remove(); showing = false; next(); }, 450); }, conf.seconds * 1000);
  }
  function confetti(n) {
    const colors = [cfg.style.color, cfg.style.accent, '#ffd600', '#ffffff', '#8b5cf6'];
    for (let i = 0; i < n; i++) {
      const c = document.createElement('div'); c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
      c.style.animationDuration = 2.2 + Math.random() * 2.5 + 's'; c.style.animationDelay = Math.random() * .8 + 's';
      document.body.appendChild(c); setTimeout(() => c.remove(), 6000);
    }
  }

  // ---------- metas ----------
  const VALUE = {likes: s => s.likes, diamonds: s => s.diamonds, follows: s => s.follows, shares: s => s.shares, gifts: s => s.gifts};
  const UNIT = {likes: '❤️', diamonds: '💎', follows: '💖', shares: '📣', gifts: '🎁'};
  function drawGoals() {
    if (!which.includes('goal') || !stats) return;
    const only = params.get('goal');
    const goals = cfg.goals.filter(g => g.on && (!only || g.id === only));
    $('#goal').innerHTML = goals.map(g => {
      const v = VALUE[g.kind](stats), pct = Math.min(100, v / g.target * 100);
      return `<div class="goal ${v >= g.target ? 'done' : ''}"><div class="head shadow"><span>${esc(g.title)}</span><span>${UNIT[g.kind]} ${v.toLocaleString(LOC)} / ${g.target.toLocaleString(LOC)}</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div></div>`;
    }).join('');
  }

  // ---------- top donadores ----------
  function drawTop() {
    if (!stats) return;
    // 1.º oro, 2.º plata, 3.º bronce: corona arriba de la foto (donadores) o medalla abajo a la derecha (likes)
    const METAL = [['#FFD54A', '#B8860B'], ['#E3E6EC', '#8C939E'], ['#E09A5B', '#8B5A2B']];
    const crown = ([c, d]) => `<svg class="crown" viewBox="0 0 40 28"><path d="M2 8l9 7 9-13 9 13 9-7-4 18H6z" fill="${c}" stroke="${d}" stroke-width="2" stroke-linejoin="round"/><circle cx="20" cy="18" r="3" fill="#E53950"/></svg>`;
    const medal = ([c, d], n) => `<svg class="medal" viewBox="0 0 32 40"><path d="M8 0h7l3 14H11zM17 0h7l-3 14h-7z" fill="#E53950"/><circle cx="16" cy="25" r="13" fill="${c}" stroke="${d}" stroke-width="3"/><text x="16" y="30.5" text-anchor="middle" font-size="15" font-weight="800" fill="${d}" font-family="sans-serif">${n}</text></svg>`;
    const board = (box, title, list, unit, value, empty, badge) => {
      box.innerHTML = `<div class="topbox"><h1 class="shadow">${title}</h1>${list.length ? `<ol>${list.map((d, i) =>
        `<li class="shadow"><span class="n">${i + 1}</span><span class="pic">${d.avatar ? `<img src="${esc(d.avatar)}" alt="" referrerpolicy="no-referrer">` : '<span class="av">👤</span>'}${i < 3 ? badge(METAL[i], i + 1) : ''}</span><span class="nm">${esc(d.name)}</span><span>${unit} ${value(d).toLocaleString(LOC)}</span></li>`).join('')}</ol>` : `<div class="empty shadow">${empty[cfg.lang] || empty.es}</div>`}</div>`;
      box.querySelectorAll('.pic img').forEach(img => { img.onerror = () => { const av = document.createElement('span'); av.className = 'av'; av.textContent = '👤'; img.replaceWith(av); }; });
    };
    if (which.includes('top')) board($('#top'), '🏆 ' + esc(cfg.top.title), stats.top.slice(0, cfg.top.count), '💎', d => d.diamonds, EMPTY_TOP, crown);
    if (which.includes('likes') && cfg.likers) board($('#likers'), '❤️ ' + esc(cfg.likers.title), (stats.likers || []).slice(0, cfg.likers.count), '❤️', d => d.likes, EMPTY_LIKES, medal);
  }

  // ---------- animaciones (una a la vez, en fila) ----------
  const animQueue = [];
  let animShowing = false;
  function playAnim(a) { if (animQueue.length < 30) animQueue.push(a); nextAnim(); }
  function nextAnim() {
    if (animShowing || !animQueue.length) return;
    animShowing = true;
    const a = animQueue.shift(), src = '/anim/' + encodeURIComponent(a.file) + '?t=' + Date.now();
    const media = document.createElement(a.video ? 'video' : 'img');
    const videoScene = !!(a.scene && a.scene.video);
    if (!videoScene) media.src = src;
    media.style.maxWidth = '96vw';
    if (a.video) { media.muted = true; media.loop = true; media.autoplay = true; media.playsInline = true; }
    let el;
    if (a.scene) {
      // Escena: el personaje entra brincando, se mece, el corazón late y el letrero dice el texto.
      const sc = a.scene, ratio = sc.ratio || 0.65;
      const hPx = Math.min(innerHeight * Math.min(a.size, 96) / 100, innerWidth * 0.96 / ratio);
      el = document.createElement('div'); el.className = 'sc';
      el.style.height = hPx + 'px'; el.style.width = hPx * ratio + 'px';
      const body = document.createElement('div'); body.className = 'body'; el.appendChild(body);
      let frames = null, vid = null;
      if (sc.video) {
        // Personaje en video (WebM con transparencia): el letrero sigue el cuadro que se está viendo.
        el.classList.add('sprite');
        vid = document.createElement('video'); vid.className = 'char';
        Object.assign(vid, {src, muted: true, loop: true, autoplay: true, playsInline: true});
        vid.onerror = () => finish && finish();
        body.appendChild(vid);
      } else if (sc.sprite) {
        // Personaje animado cuadro por cuadro: una tira de cuadros que vamos cambiando aquí, para que el letrero lo siga.
        el.classList.add('sprite');
        frames = document.createElement('div'); frames.className = 'frames';
        frames.style.backgroundImage = `url("/anim/${encodeURIComponent(sc.sprite.file)}")`;
        frames.style.backgroundSize = `${sc.sprite.n * 100}% 100%`;
        body.appendChild(frames);
      } else { media.className = 'char'; body.appendChild(media); }
      for (const part of sc.parts || []) {
        const p = document.createElement('img'); p.className = 'part ' + (part.anim || ''); p.src = '/anim/' + encodeURIComponent(part.file);
        const [x, y, pw, ph] = part.box; Object.assign(p.style, {left: x + '%', top: y + '%', width: pw + '%', height: ph + '%'});
        body.appendChild(p);
      }
      const sign = document.createElement('div'); sign.className = 'sign';
      const place = box => {  // box: [x, y, w, h] (esquina) o [cx, cy, w, h, grados] (centro, de la tira de cuadros)
        if (box.length > 4) Object.assign(sign.style, {left: box[0] - box[2] / 2 + '%', top: box[1] - box[3] / 2 + '%', width: box[2] + '%', height: box[3] + '%', transform: `rotate(${box[4]}deg)`});
        else Object.assign(sign.style, {left: box[0] + '%', top: box[1] + '%', width: box[2] + '%', height: box[3] + '%'});
      };
      const signBox = sc.track ? [sc.track[0][0], sc.track[0][1], Math.min(...sc.track.map(b => b[2])), Math.min(...sc.track.map(b => b[3])), 0] : sc.sign, sw = signBox[2], sh = signBox[3];
      place(signBox);
      const inner = document.createElement('div'); inner.className = 'in';
      const span = document.createElement('span');
      span.innerHTML = esc(a.sign || '').split('{user}').join(a.user ? `<span class="u">${esc(a.user)}</span>` : '');
      inner.appendChild(span); sign.appendChild(inner); body.appendChild(sign);
      if (vid) {
        const fps = sc.video.fps || 16, n = sc.track.length;
        const tick = () => {
          if (!el.isConnected) return;
          place(sc.track[Math.min(n - 1, Math.floor(vid.currentTime * fps)) % n] || sc.track[0]);
          requestAnimationFrame(tick);
        };
        vid.play().catch(() => {});
        requestAnimationFrame(tick);
      }
      if (frames) {
        let i = 0;
        const step = () => {
          if (!el.isConnected) return;
          frames.style.backgroundPosition = `${sc.sprite.n > 1 ? i * 100 / (sc.sprite.n - 1) : 0}% 0`;
          place(sc.track[i] || sc.track[0]);
          const wait = sc.sprite.durs[i] || 120;
          i = (i + 1) % sc.sprite.n;
          setTimeout(step, wait);
        };
        setTimeout(step, 0);
      }
      $('#anim').appendChild(el);
      // Que el texto quepa en el letrero: empezar grande e ir bajando.
      const sH = hPx * sh / 100 * 0.88;
      let fs = sH * 0.5;
      span.style.fontSize = fs + 'px';
      span.style.width = '100%';
      while (fs > 8 && (span.scrollWidth > span.clientWidth + 1 || span.offsetHeight > sH)) { fs *= 0.93; span.style.fontSize = fs + 'px'; }
      span.style.width = span.clientWidth + 'px'; span.style.flex = 'none';  // que no se reacomode cuando el letrero cambia de tamaño
    } else if (a.who && a.who.name) {
      // Con nombre: la animación y abajo la tarjeta con la foto y el nombre.
      media.className = 'a'; media.style.height = Math.min(a.size, 82) + 'vh';
      el = document.createElement('div'); el.className = 'w'; el.appendChild(media);
      const who = document.createElement('div'); who.className = 'who';
      who.innerHTML = `${a.who.avatar ? `<img src="${esc(a.who.avatar)}" alt="" referrerpolicy="no-referrer">` : '<span class="av">💜</span>'}<span class="t"><b>${esc(a.who.name)}</b>${a.caption ? `<small>${esc(a.caption)}</small>` : ''}</span>`;
      const pic = who.querySelector('img');
      if (pic) pic.onerror = () => { const av = document.createElement('span'); av.className = 'av'; av.textContent = '💜'; pic.replaceWith(av); };
      el.appendChild(who);
    } else {
      el = media; el.className = 'a center'; el.style.height = a.size + 'vh';
    }
    const outClass = a.scene ? 'sc out' : el === media ? 'a center out' : 'w out';
    let done = false;
    const finish = () => { if (done) return; done = true; el.className = outClass; setTimeout(() => { el.remove(); animShowing = false; nextAnim(); }, a.scene ? 520 : 400); };
    if (!videoScene) media.onerror = finish;
    $('#anim').appendChild(el);
    setTimeout(finish, a.seconds * 1000);
  }
  function showBrb(b) {
    const box = $('#brb');
    if (!b || !b.on) { box.hidden = true; box.className = ''; box.innerHTML = ''; return; }
    const src = '/anim/' + encodeURIComponent(b.file);
    const pic = b.file.toLowerCase().endsWith('.webm') ? `<video class="pic" src="${src}" autoplay muted loop playsinline></video>` : `<img class="pic" src="${src}" alt="">`;
    box.className = b.dim ? 'dim' : '';
    box.innerHTML = `${pic}<h1 class="shadow">${esc(b.text)}</h1>${b.sub ? `<p class="shadow">${esc(b.sub)}</p>` : ''}`;
    box.hidden = false;
  }

  // ---------- animaciones especiales: salen encima de todo, con su sonido, hasta que terminan ----------
  let spTimer = null;
  function stopSpecial() {
    clearTimeout(spTimer);
    for (const el of $('#special').children) { el.classList.add('out'); if (el.pause) setTimeout(() => el.pause(), 400); setTimeout(() => el.remove(), 450); }
  }
  function showSpecial(sp) {
    stopSpecial();
    const src = '/anim/' + encodeURIComponent(sp.file);
    const el = document.createElement(sp.video ? 'video' : 'img');
    el.className = 'sp'; el.src = src; el.style.height = sp.size + 'vh'; el.style.maxWidth = '100vw';
    if (sp.video) {
      el.playsInline = true; el.volume = Math.max(0, Math.min(1, sp.volume / 100)); el.muted = sp.volume === 0;
      el.onended = () => { if (!sp.seconds) stopSpecial(); };
      el.play().catch(() => { el.muted = true; el.play().catch(() => {}); });  // si no deja con sonido, al menos que se vea
      if (sp.seconds) el.loop = true;
    }
    el.onerror = stopSpecial;
    $('#special').appendChild(el);
    if (sp.seconds || !sp.video) spTimer = setTimeout(stopSpecial, (sp.seconds || 8) * 1000);
  }

  const isPreview = params.has('preview');
  function onEvent(ev) {
    if (ev.preview && !isPreview) return;  // pruebas desde la vista previa de EC-Tok: no salen en el live
    if (ev.type === 'special') { if (which.includes('special')) showSpecial(ev); return; }
    if (ev.type === 'special_stop') { if (which.includes('special')) stopSpecial(); return; }
    if (ev.type === 'anim') { if (which.includes('anim')) playAnim(ev); return; }
    if (ev.type === 'brb') { if (which.includes('anim')) showBrb(ev.brb); return; }
    if (ev.stats) stats = ev.stats;
    if (ev.type === 'config') { cfg = ev.overlay; stats = ev.overlay.stats; applyStyle(); if (which.includes('anim')) showBrb(cfg.brb); }
    if (ev.type === 'stats_reset') { load(); return; }
    if (which.includes('alerts')) {
      const conf = wantAlert(ev); if (conf) { queue.push({ev, conf}); next(); }
      if (ev.type === 'like' && stats) likeMilestone(stats.likes);
    }
    drawGoals(); drawTop();
  }

  async function load() {
    const data = await (await fetch('/api/overlay')).json();
    // Si EC-Tok se actualizó, recargar este overlay para usar la versión nueva (LIVE Studio/OBS lo dejan abierto).
    if (OV_VERSION && data.version && data.version !== OV_VERSION) { location.reload(); return; }
    OV_VERSION = data.version || OV_VERSION;
    cfg = data; stats = data.stats; LOC = {en: 'en-US', pt: 'pt-BR'}[data.lang] || 'es-MX'; likeMark = Math.floor(stats.likes / (cfg.alerts.like.every || 1)) * (cfg.alerts.like.every || 1);
    applyStyle();
    if (which.includes('anim')) showBrb(data.brb);
    $('#goal').hidden = !which.includes('goal'); $('#top').hidden = !which.includes('top'); $('#likers').hidden = !which.includes('likes'); $('#alerts').hidden = !which.includes('alerts');
    drawGoals(); drawTop();
  }
  load().then(() => {
    const es = new EventSource('/api/stream?who=overlay');
    es.onmessage = m => { try { onEvent(JSON.parse(m.data)); } catch (_) {} };
    es.onopen = () => load().catch(() => {});
  }).catch(() => setTimeout(() => location.reload(), 3000));
</script>
</body>
</html>
